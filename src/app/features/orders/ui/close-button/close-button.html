<button type="button" class="close" [attr.aria-label]="label()" (click)="onClick($event)">

    <svg
      viewBox="0 0 16 16"
      width="13"
      height="13"
      aria-hidden="true"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M3 4h10M6 4V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V4m-6.5 0 .6 8.5a1 1 0 0 0 1 .9h4.8a1 1 0 0 0 1-.9L11.5 4"
      />
      <path d="M6.5 7v4M9.5 7v4" />
    </svg>
  } @else {
    <span aria-hidden="true">✕</span>
  }
</button>
