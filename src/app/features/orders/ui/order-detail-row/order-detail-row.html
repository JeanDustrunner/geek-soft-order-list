<td></td>
<td></td>
<td></td>
<td>
  {{ order().id }}
</td>
<td>
  {{ order().side }}
</td>
<td>
  {{ order().size | number: '1.0-2' }}
</td>
<td>
  {{ order().openTime | date: 'dd.MM.yyyy HH:mm:ss' }}
</td>
<td>
  {{ order().openPrice | number: '1.2-5' }}
</td>
<td>
  {{ order().swap | money }}
</td>
<td [class]="profit() | profitClass">
  {{ (profit() | money) ?? '—' }}
</td>
<td>
  <app-close-button
    [label]="'Close order ' + order().id"
    (closeRequested)="closeRequested.emit()"
  />
</td>
