<td></td>
<td></td>
<td></td>
<td>
    {{ row().order.id }}
</td>
<td>
    {{ row().order.side }}
</td>
<td>
    {{ row().order.size | number: '1.0-2' }}
</td>
<td>
    {{ row().order.openTime | date: 'dd.MM.yyyy HH:mm:ss' }}
</td>
<td>
    {{ row().order.openPrice | number: '1.2-5' }}
</td>
<td>
    {{ row().order.swap | number: '1.2-2' }}
</td>
<td [class]="row().profit | profitClass">
    {{ (row().profit | number: '1.2-2') ?? '—' }}
</td>
<td>
    <app-close-button 
        [label]="'Close order ' + row().order.id" 
        (closeRequested)="closeRequested.emit()" 
    />
</td>
